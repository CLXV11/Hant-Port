name: star-history

on:
  schedule:
    - cron: "0 0 * * 0"        # كل أحد منتصف الليل UTC
  workflow_dispatch:           # زر يدوي
  push:
    branches: [main]
    paths:
      - "tools/star_history.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/star_history.py
      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/star-history.svg
          git diff --cached --quiet || git commit -m "chore: update star history [skip ci]"
          git push
